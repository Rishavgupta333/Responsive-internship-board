<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Board</title>
  <meta name="description" content="Search and filter internships by domain, mode and skills.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#results">Skip to results</a>

  <header class="hero">
    <div class="wrap">
      <p class="hero-note">Internship Board</p>
      <h1>Find the internship that fits your skills.</h1>
      <p class="hero-sub">Search by role, skill or city, then narrow down by domain and work mode.</p>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="Search and filters">
      <div class="wrap">
        <form id="filter-form" role="search" novalidate>
          <div class="field grow">
            <label for="search">Search</label>
            <input id="search" type="search" placeholder="Try &ldquo;SQL&rdquo; or &ldquo;Pune&rdquo;" autocomplete="off">
          </div>
          <div class="field">
            <label for="mode">Work mode</label>
            <select id="mode">
              <option value="">Any mode</option>
              <option>Remote</option>
              <option>Hybrid</option>
              <option>On-site</option>
            </select>
          </div>
        </form>

        <div class="chips" role="group" aria-label="Filter by domain" id="domains"></div>
      </div>
    </section>

    <section class="wrap results-area" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">Open roles</h2>
        <p id="status" role="status" aria-live="polite">Loading internships&hellip;</p>
      </div>
      <div id="results" class="grid" tabindex="-1"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p>Sample data is fictional. Built with plain HTML, CSS and JavaScript.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
